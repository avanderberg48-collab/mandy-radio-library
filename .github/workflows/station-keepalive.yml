name: station-keepalive

on:
  schedule:
    - cron: "*/25 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Look at the station
        id: check
        run: |
          set +e
          out=$(python3 check_station.py)
          echo "$out"
          echo "songs=$(printf '%s\n' "$out" | grep '^songs=' | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Heal the library
        if: ${{ fromJSON(steps.check.outputs.songs || '0') < 50 }}
        env:
          MANDY_PAT: ${{ secrets.MANDY_PAT }}
        run: python3 trigger_heal.py

      - name: Report
        if: always()
        run: echo "station had ${{ steps.check.outputs.songs }} songs"
