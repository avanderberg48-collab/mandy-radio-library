<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaleidoscope Online - live music</title>
<style>
body{font-family:Verdana,sans-serif;background:#101828;color:#fff;text-align:center;padding:22px 14px;font-size:22px}
h1{font-size:38px;color:#7ee0ff;margin:0 0 6px}
.tag{font-size:19px;color:#ffd166;margin:0 0 20px}
button{display:block;width:100%;max-width:640px;margin:0 auto 14px;padding:24px;font-size:26px;font-weight:bold;border:none;border-radius:16px;color:#fff;background:#1f3b63}
#pbtn{background:#2bb673}
.half{display:inline-block;width:47%;max-width:300px;margin:0 1% 14px;padding:22px;font-size:23px;font-weight:bold;border:none;border-radius:16px;color:#fff;background:#1f3b63}
#now2{font-size:22px;color:#cfe9ff;max-width:640px;margin:16px auto 0}
#say{font-size:20px;color:#7ee0ff;max-width:640px;margin:8px auto 0;min-height:26px}
.note{font-size:16px;color:#9fb8d0;max-width:640px;margin:24px auto 0}
</style>
</head>
<body>
<h1>Kaleidoscope Online</h1>
<p class="tag">Radio for blind people, in South Africa and overseas</p>
<button id="pbtn">Play the station</button>
<button id="sbtn">What is playing now</button>
<button id="vup" class="half">Volume up</button><button id="vdn" class="half">Volume down</button>
<p id="now2">Connecting to the station...</p>
<p id="say" role="status" aria-live="polite"></p>
<p class="note">This plays the real station, so you hear the live programmes and the microphone too. If the studio is asleep it may take half a minute to wake up.</p>
<script>
(function(){
var LIVE="https://superagent-269bfe30.base44.app/functions/kaleidoscopeRadio?go=stream";
var NP="https://superagent-269bfe30.base44.app/functions/kaleidoscopeRadio?action=np";
var A=null,fails=0,tries=0,npTimer=null,liveSaid=false,cur="";
function $(i){return document.getElementById(i);}
function SAY(t){var e=$("say");if(e)e.textContent=t;}
function NOW(t){var e=$("now2");if(e)e.textContent=t;}
function mmss(x){x=Math.max(0,Math.floor(x||0));var m=Math.floor(x/60),q=x%60;return m+":"+(q<10?"0":"")+q;}
function attach(){
  A=new Audio();A.preload="none";
  A.addEventListener("playing",function(){fails=0;SAY("Music playing.");});
  A.addEventListener("error",function(){fails++;NOW("Reconnecting to the station...");setTimeout(play,6000);});
  A.addEventListener("stalled",function(){setTimeout(function(){if(A&&A.readyState<3)play();},4000);});
  A.addEventListener("ended",function(){setTimeout(play,3000);});
}
function play(){
  if(!A)attach();
  var p=A.play?null:null;
  try{A.src=LIVE+"&r="+Date.now();}catch(e){}
  var pr=A.play();
  if(pr&&pr.catch)pr.catch(function(){SAY("Tap Play the station once more to start.");});
}
function pollNP(){
  fetch(NP,{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){
    if(d&&d.closed){NOW("The station is closed for the night. Back at 05:00.");return;}
    if(d&&d.np){cur=String(d.np).replace(/_/g," ");NOW("Now playing: "+cur+(d.listeners?"   ("+d.listeners+" listening)":""));}
    if(d&&d.live&&!liveSaid){liveSaid=true;SAY("Live from the studio now.");}
    if(d&&!d.live)liveSaid=false;
  }).catch(function(){});
}
$("pbtn").addEventListener("click",function(){fails=0;tries++;SAY("Connecting...");play();});
$("sbtn").addEventListener("click",function(){
  var t=cur?("Now playing: "+cur):"";
  if(A&&!A.paused&&A.duration)t=t+" ("+mmss(A.currentTime)+" of "+mmss(A.duration)+")";
  if(!t)t="Still connecting, try again in a moment.";
  NOW(t);SAY(t);
});
$("vup").addEventListener("click",function(){if(!A)return;A.volume=Math.min(1,A.volume+0.2);SAY("Volume "+Math.round(A.volume*100)+" percent");});
$("vdn").addEventListener("click",function(){if(!A)return;A.volume=Math.max(0,A.volume-0.2);SAY("Volume "+Math.round(A.volume*100)+" percent");});
setInterval(function(){if(A&&!A.paused&&cur)NOW("Now playing: "+cur+" ("+mmss(A.currentTime)+")");},5000);
setInterval(pollNP,15000);
pollNP();
})();
</script>
</body>
</html>
